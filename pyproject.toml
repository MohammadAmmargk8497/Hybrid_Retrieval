[project]
name = "hybrid-retrieval"
version = "0.2.0"
description = "Hybrid (vector + BM25 + RRF) retrieval over a local PDF library."
authors = [
    {name = "Ammar"}
]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "numpy (>=1.26,<3.0)",
    "qdrant-client (>=1.12,<2.0)",
    "sentence-transformers (>=3.0,<6.0)",
    "torch (>=2.1,<3.0)",
    "einops (>=0.7,<1.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "langchain-text-splitters (>=0.0.1,<1.0.0)",
    "bm25s (>=0.2.13,<1.0.0)",
    "pydantic (>=2.0,<3.0)",
    "requests (>=2.31,<3.0)"
]

[project.optional-dependencies]
dev = [
    "ruff (>=0.6,<1.0)",
    "mypy (>=1.10,<2.0)",
    "pytest (>=8,<9)",
]

[project.scripts]
hybrid-retrieval = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
